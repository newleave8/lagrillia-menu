<!doctype html><html lang="ko"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#222;font:16px/1.6 Arial,'Malgun Gothic',sans-serif}main{max-width:560px;margin:auto;padding:22px}h2{margin:0 0 5px;font-size:24px}.store{color:#53624e;margin:0 0 18px}label{display:block;font-weight:700;margin:14px 0 5px}input,textarea{font:inherit;width:100%;padding:12px;border:1px solid #bbb;border-radius:7px}textarea{min-height:100px;resize:vertical}button{width:100%;border:0;border-radius:8px;padding:16px;background:#f76712;color:#fff;font:bold 18px Arial;margin-top:22px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.small{font-size:13px;color:#666}.status{white-space:pre-wrap;margin:15px 0;color:#8a321b}.success{text-align:center;padding-top:22px}.check{font-size:55px;color:#198744}.receipt{padding:15px;background:#f5f5f1;border-radius:9px;text-align:left;margin:20px 0}dl{display:grid;grid-template-columns:120px 1fr;gap:8px}dt,dd{margin:0}dd{text-align:right;font-weight:bold}#summary{padding:10px 0;color:#555}</style></head><body><main><div id="entry"><h2>선주문 내역 전달</h2><p class="store">라그릴리아 판교점</p><p class="small">이미 예약하신 고객님의 메뉴 선택 내역을 전달합니다.</p><div id="summary">장바구니를 불러오고 있습니다…</div><form id="orderForm"><label for="date">예약일자</label><input type="date" id="date" required><label for="name">고객명</label><input id="name" autocomplete="name" maxlength="50" required><label for="phone">휴대폰 뒤 4자리</label><input id="phone" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="off" placeholder="예: 1234" required><label for="note">점포 전달 사항 <span class="small">(선택)</span></label><textarea id="note" maxlength="1000" placeholder="점포에 미리 알려주실 내용이 있으면 작성해 주세요."></textarea><button id="send" disabled>선주문 내역 전달</button></form><div id="status" class="status" role="status"></div></div><div id="done" class="success" hidden><div class="check">✓</div><h2>선주문 전달 완료</h2><p>선주문 내역이 점포에 전달되었습니다.<br>품절 및 메뉴 특이사항 발생 시 연락드리겠습니다.</p><div id="receipt" class="receipt"></div><button onclick="finish()">확인</button></div></main><script>
const channel=<?!= JSON.stringify(channel) ?>;const hostOrigin='https://newleave8.github.io';const $=id=>document.getElementById(id);let cartData=null,pending=null,receipt=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(type,data){window.top.postMessage({type,channel,...data},hostOrigin)}
window.addEventListener('message',e=>{if(e.origin!==hostOrigin||e.source!==window.top||e.data?.channel!==channel||e.data?.type!=='lag-preorder-cart'||cartData)return;cartData=e.data.cart;$('summary').textContent=cartData.summary+' · 예상 합계 '+Number(cartData.total).toLocaleString('ko-KR')+'원';$('send').disabled=false});
notify('lag-preorder-ready',{});
$('orderForm').addEventListener('input',()=>{pending=null});
$('orderForm').addEventListener('submit',async e=>{e.preventDefault();if(!cartData)return;const b=$('send');b.disabled=true;for(const id of ['date','name','phone','note'])$(id).disabled=true;try{if(!pending)pending={requestId:crypto.randomUUID(),storeId:'pangyo',date:$('date').value,name:$('name').value.trim(),phone:$('phone').value,note:$('note').value,lines:cartData.lines};notify('lag-preorder-submitting',{});$('status').textContent='점포에 전달 중입니다. 화면을 닫지 마세요.';receipt=await new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).submitPreorder(pending));$('entry').hidden=true;$('done').hidden=false;$('receipt').innerHTML='<dl><dt>접수번호</dt><dd>'+esc(receipt.number)+'</dd><dt>예약일자</dt><dd>'+esc(receipt.date)+'</dd><dt>고객명</dt><dd>'+esc(pending.name)+'</dd><dt>휴대폰 뒤 4자리</dt><dd>'+esc(pending.phone)+'</dd><dt>예상 총액</dt><dd>'+Number(receipt.total).toLocaleString('ko-KR')+'원</dd></dl>';notify('lag-preorder-saved',{receipt})}catch(err){notify('lag-preorder-failed',{});$('status').textContent='전달되지 않았거나 응답을 확인하지 못했습니다. '+(err?.message||'잠시 후 다시 시도해 주세요.')+'\n응답 확인 실패 시 같은 내용으로 다시 누르면 중복 접수되지 않습니다.'}finally{b.disabled=false;for(const id of ['date','name','phone','note'])$(id).disabled=false}});
function finish(){notify('lag-preorder-close',{})}
</script></body></html>
