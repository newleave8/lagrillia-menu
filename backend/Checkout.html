<!doctype html><html lang="ko"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>*{box-sizing:border-box}body{margin:0;background:#fff;color:#222;font:16px/1.6 Arial,'Malgun Gothic',sans-serif}main{max-width:560px;margin:auto;padding:22px}h2{margin:0 0 5px;font-size:24px}.store{color:#53624e;margin:0 0 18px}label{display:block;font-weight:700;margin:14px 0 5px}input,textarea{font:inherit;width:100%;padding:12px;border:1px solid #bbb;border-radius:7px}textarea{min-height:100px;resize:vertical}button{width:100%;border:0;border-radius:8px;padding:16px;background:#f76712;color:#fff;font:bold 18px Arial;margin-top:22px;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.small{font-size:13px;color:#666}.status{white-space:pre-wrap;margin:15px 0;color:#8a321b}.success{text-align:center;padding-top:22px}.check{font-size:55px;color:#198744}.receipt{padding:15px;background:#f5f5f1;border-radius:9px;text-align:left;margin:20px 0}dl{display:grid;grid-template-columns:120px 1fr;gap:8px}dt,dd{margin:0}dd{text-align:right;font-weight:bold}#summary{padding:10px 0;color:#555}.field-label{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 10px}.field-hint{font-size:12px;font-weight:400;color:#777;line-height:1.5}#finalNotice{width:min(420px,calc(100% - 32px));padding:24px;border:0;border-radius:12px;color:#222820;background:#fff}#finalNotice::backdrop{background:#0008}#finalNotice h2{font-size:19px;margin:0 0 14px}#finalNotice p{font-size:16px;line-height:1.7;margin:0 0 22px;word-break:keep-all}.notice-actions{display:flex;justify-content:flex-end;gap:10px}.notice-actions button{width:auto;margin:0;padding:11px 20px;font-size:16px}.notice-actions .notice-cancel{background:#fff;color:#333;border:1px solid #ddd}</style></head><body><main><div id="entry"><h2>선주문 접수</h2><p class="store">라그릴리아 판교점</p><p class="small">매장과 확정한 예약 정보를 입력하고 선주문을 접수해 주세요.</p><div id="summary">장바구니를 불러오고 있습니다…</div><form id="orderForm"><label for="date" class="field-label"><span>예약일자</span><span id="dateHint" class="field-hint">매장과 확정한 예약일자를 입력해 주세요.</span></label><input type="date" id="date" aria-describedby="dateHint" required><label for="name" class="field-label"><span>고객명</span><span id="nameHint" class="field-hint">예약자명과 동일하게 입력해 주세요.</span></label><input id="name" aria-describedby="nameHint" autocomplete="name" maxlength="50" required><label for="phone" class="field-label"><span>휴대폰 뒤 4자리</span><span id="phoneHint" class="field-hint">예약에 사용한 휴대폰 번호의 뒤 4자리를 입력해 주세요.</span></label><input id="phone" aria-describedby="phoneHint" inputmode="numeric" pattern="[0-9]{4}" minlength="4" maxlength="4" autocomplete="off" placeholder="예: 1234" required><label for="serveTime">메뉴 제공 시간</label><p class="small" style="margin:0 0 6px">(지정한 시간에 메뉴를 미리 준비해드립니다.)</p><input type="time" id="serveTime" step="60" required><label for="note">점포 전달 사항 <span class="small">(선택)</span></label><textarea id="note" maxlength="1000" placeholder="점포에 미리 알려주실 내용이 있으면 작성해 주세요."></textarea><button id="send" disabled>선주문 접수</button></form><div id="status" class="status" role="status"></div></div><div id="done" class="success" hidden><div class="check">✓</div><h2>선주문 완료</h2><p>품절 및 메뉴 특이사항 발생 시 연락드리겠습니다.</p><div id="receipt" class="receipt"></div><button onclick="finish()">확인</button></div></main><dialog id="finalNotice" aria-labelledby="finalNoticeTitle"><h2 id="finalNoticeTitle">선주문 접수 안내</h2><p>주문한 메뉴의 변경이 필요한 경우 매장으로 연락 부탁드립니다.</p><form method="dialog" class="notice-actions"><button class="notice-cancel" value="cancel">취소</button><button value="confirm" autofocus>확인</button></form></dialog><script>
const channel=<?!= JSON.stringify(channel) ?>;const hostOrigin='https://newleave8.github.io';const $=id=>document.getElementById(id);let cartData=null,pending=null,receipt=null;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notify(type,data){window.top.postMessage({type,channel,...data},hostOrigin)}
window.addEventListener('message',e=>{if(e.origin!==hostOrigin||e.source!==window.top||e.data?.channel!==channel||e.data?.type!=='lag-preorder-cart'||cartData)return;cartData=e.data.cart;$('summary').textContent=cartData.summary+' · 예상 합계 '+Number(cartData.total).toLocaleString('ko-KR')+'원';$('send').disabled=false});
notify('lag-preorder-ready',{});
$('orderForm').addEventListener('input',()=>{pending=null});
$('orderForm').addEventListener('submit',e=>{
 e.preventDefault();
 if(!cartData||$('send').disabled)return;
 $('finalNotice').returnValue='';
 $('finalNotice').showModal();
});
$('finalNotice').addEventListener('close',()=>{
 if($('finalNotice').returnValue==='confirm')submitOrder();
});
async function submitOrder(){
 if(!cartData||$('send').disabled||!$('orderForm').reportValidity())return;
 const b=$('send');b.disabled=true;for(const id of ['date','name','phone','serveTime','note'])$(id).disabled=true;try{if(!pending)pending={requestId:crypto.randomUUID(),storeId:'pangyo',date:$('date').value,name:$('name').value.trim(),phone:$('phone').value,serveTime:$('serveTime').value,note:$('note').value,lines:cartData.lines};notify('lag-preorder-submitting',{});$('status').textContent='선주문 접수 중입니다. 화면을 닫지 마세요.';receipt=await new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).submitPreorder(pending));$('entry').hidden=true;$('done').hidden=false;$('receipt').innerHTML='<dl><dt>접수번호</dt><dd>'+esc(receipt.number)+'</dd><dt>예약일자</dt><dd>'+esc(receipt.date)+'</dd><dt>메뉴 제공 시간</dt><dd>'+esc(receipt.serveTime||pending.serveTime)+'</dd><dt>고객명</dt><dd>'+esc(pending.name)+'</dd><dt>휴대폰 뒤 4자리</dt><dd>'+esc(pending.phone)+'</dd><dt>예상 총액</dt><dd>'+Number(receipt.total).toLocaleString('ko-KR')+'원</dd></dl>';notify('lag-preorder-saved',{receipt})}catch(err){notify('lag-preorder-failed',{});$('status').textContent='접수되지 않았거나 응답을 확인하지 못했습니다. '+(err?.message||'잠시 후 다시 시도해 주세요.')+'\n응답 확인 실패 시 같은 내용으로 다시 누르면 중복 접수되지 않습니다.'}finally{b.disabled=false;for(const id of ['date','name','phone','serveTime','note'])$(id).disabled=false}}
function finish(){notify('lag-preorder-close',{})}
</script></body></html>
