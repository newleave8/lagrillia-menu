<!doctype html><html lang="ko"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><title>라그릴리아 메뉴 관리</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4f1;font:15px/1.55 Arial,'Malgun Gothic',sans-serif;color:#222}header{background:#20271e;color:white;padding:18px 20px;font:700 25px Georgia}main{max-width:800px;margin:20px auto;padding:0 14px}section{background:#fff;border:1px solid #ddd;border-radius:12px;padding:18px;margin-bottom:15px}label{display:block;font-weight:bold;margin:13px 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid #bcbcb8;border-radius:6px;font:inherit}textarea{min-height:90px;white-space:pre-wrap}button{padding:12px 16px;border:0;border-radius:7px;background:#29352a;color:#fff;font-weight:bold;cursor:pointer}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{border:1px solid #ddd;padding:12px;margin:12px 0;border-radius:8px}.small{font-size:12px;color:#666}.status{background:#eef5ee;padding:12px;border-radius:8px;white-space:pre-wrap;margin:12px 0}.hide{display:none}.preview{max-width:170px;max-height:120px;display:block;margin:8px 0}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header>LAGRILLIA · 관리자</header><main><section id="login"><h2>관리자 로그인</h2><label>관리자 비밀번호</label><input type="password" id="pin" autocomplete="off"><p class="small">비밀번호는 서버에서 검증하며 이 페이지에 저장되지 않습니다.</p><button onclick="login()">로그인</button></section><section id="editor" class="hide"><h2>메뉴 등록 / 수정</h2><label>기존 메뉴</label><select id="existing" onchange="chooseMenu()"><option value="">신규 등록</option></select><div class="grid"><div><label>카테고리</label><select id="category"><option>그릴</option><option>시즌 메뉴</option><option>세트</option><option>파스타</option><option>라이스</option><option>피자</option><option>샐러드</option><option>사이드</option><option>디저트</option><option>음료</option><option>맥주</option><option>와인</option></select></div><div><label>판매가(원)</label><input id="price" type="number"></div></div><label>메뉴명</label><input id="name"><label>영문명</label><input id="en"><label>표시 배지</label><select id="tag"><option value="">없음</option><option>New</option><option>Special Price</option><option>Premium</option><option>Signature</option><option>Best</option><option>Season</option></select><label>목록용 간단 설명</label><textarea id="summary"></textarea><label>상세 설명 (줄바꿈 지원)</label><textarea id="detail"></textarea><label>이미지 하단 문구</label><input id="caption"><label>메뉴 사진</label><input type="file" id="photo" accept="image/png,image/jpeg,image/webp"><div id="optionArea"></div><button onclick="addOptionGroup()">+ 옵션 그룹 추가</button><hr><button id="save" onclick="save()">최종 등록·저장</button><p class="small">저장 성공 시 회사 메뉴북 시트 및 드라이브에 반영됩니다. 고객 화면 게시 여부는 별도로 확인해야 합니다.</p></section><div class="status" id="status">중앙 저장 시스템 배포 전입니다.</div></main><script>
let token='',db=null,selected='',optionGroups=[];
const $=id=>document.getElementById(id);
const status=t=>$('status').textContent=t;
function call(fn,arg){return new Promise((resolve,reject)=>{const runner=google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);runner[fn](...arg)})}
async function login(){try{token=await call('signin',[$('pin').value]);$('pin').value='';db=await call('loadAdmin',[token]);$('login').classList.add('hide');$('editor').classList.remove('hide');fillExisting();status('연결 성공: 중앙 메뉴 데이터 로딩 완료')}catch(e){status('인증 실패: '+e.message)}}
function fillExisting(){$('existing').innerHTML='<option value="">신규 등록</option>'+db.menus.map((m,i)=>'<option value="'+i+'">'+String(m['메뉴명']||'')+'</option>').join('')}
function chooseMenu(){const idx=$('existing').value;if(idx===''){selected='';['name','en','summary','detail','caption','price'].forEach(k=>$(k).value='');optionGroups=[];renderGroups();return}const d=db.menus[+idx];selected=d['메뉴ID'];$('category').value=d['카테고리']||'그릴';$('name').value=d['메뉴명']||'';$('en').value=d['영문명']||'';$('price').value=d['판매가(원)']||'';$('tag').value=d['배지']||'';$('summary').value=d['간단설명']||'';$('detail').value=d['상세설명']||'';$('caption').value=d['이미지하단문구']||'';const gid=d['옵션그룹ID'];optionGroups=db.groups.filter(g=>g['옵션그룹ID']===gid).map(g=>({id:gid,name:g['그룹명'],min:g['최소선택'],max:g['최대선택'],items:db.items.filter(o=>o['옵션그룹ID']===gid).map(o=>({id:o['옵션ID'],name:o['옵션명'],extra:o['추가금액(원)'],imageUrl:o['이미지URL']}))}));renderGroups()}
function addOptionGroup(){optionGroups.push({name:'',min:1,max:1,items:[]});renderGroups()}
function renderGroups(){const area=$('optionArea');area.replaceChildren();optionGroups.forEach((g,i)=>{const sec=document.createElement('div');sec.className='opt';const h=document.createElement('h3');h.textContent='옵션 그룹 '+(i+1);sec.append(h);for(const [field,label] of [['name','그룹명'],['min','최소 선택'],['max','최대 선택']]){const lab=document.createElement('label');lab.textContent=label;const inp=document.createElement('input');inp.type=field==='name'?'text':'number';inp.value=g[field]??'';inp.oninput=e=>g[field]=e.target.value;sec.append(lab,inp)}g.items.forEach((o,j)=>{const div=document.createElement('div');div.className='opt';const name=document.createElement('input');name.value=o.name||'';name.placeholder='옵션명';name.oninput=e=>o.name=e.target.value;const extra=document.createElement('input');extra.type='number';extra.value=o.extra||0;extra.oninput=e=>o.extra=e.target.value;const photo=document.createElement('input');photo.type='file';photo.accept='image/jpeg,image/png,image/webp';photo.onchange=async e=>o.photo=await readPhoto(e.target.files[0]);div.append('옵션명',name,'추가금',extra,'옵션 사진',photo);sec.append(div)});const btn=document.createElement('button');btn.textContent='+ 항목';btn.onclick=()=>{g.items.push({name:'',extra:0});renderGroups()};sec.append(btn);area.append(sec)})}
function readPhoto(file){if(!file)return Promise.resolve(null);if(file.size>3e6)throw Error('사진은 3MB 이하');return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res({name:file.name,mime:file.type,data:r.result});r.onerror=rej;r.readAsDataURL(file)})}
async function save(){const b=$('save');b.disabled=true;try{const photo=await readPhoto($('photo').files[0]);const d=selected?db.menus.find(x=>x['메뉴ID']===selected):null;const menu={id:selected,category:$('category').value,name:$('name').value,en:$('en').value,price:Number($('price').value),tag:$('tag').value,summary:$('summary').value,detail:$('detail').value,caption:$('caption').value,groupId:d?.['옵션그룹ID']||'',imageUrl:d?.['이미지URL']||'',imageName:d?.['이미지파일명']||''};if(!menu.name.trim())throw Error('메뉴명을 입력하세요');const r=await call('saveAdmin',[token,{menu,photo,groups:optionGroups}]);status('중앙 DB 저장 성공 · 메뉴ID: '+r.id);db=await call('loadAdmin',[token]);selected=r.id;fillExisting()}catch(e){status('저장 실패: '+e.message)}finally{b.disabled=false}}
</script></body></html>
