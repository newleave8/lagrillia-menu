const money=n=>n===null?'가격 확인 중':n.toLocaleString('ko-KR')+'원';function render(){document.getElementById('tabs').innerHTML=cats.map(c=>`<button class="${cat===c?'active':''}" onclick="switchCat('${c}')">${c}</button>`).join('');let rows=menus.filter(m=>m.cat===cat);document.getElementById('content').innerHTML=rows.length?(cat==='시즌 메뉴'?'<img src="assets/season-banner.svg" alt="Season ON THE TABLE" style="display:block;width:100%;height:auto;margin:0 0 16px">':'')+rows.map((m,i)=>`${i===0||m.section!==rows[i-1].section?`<div class="section">${m.section}</div>`:''}<div class="menu-row" onclick="openMenu('${m.id}')"><img src="${A+m.img}"><div class="desc">${m.tag?`<span class="tag ${m.tag==='New'?'orange':''}">${m.tag}</span><br>`:''}<strong>${m.name}</strong><div class="en">${m.en||''}</div><div class="muted">${m.desc}</div></div><div class="price">${m.price===null?'—':(m.price/1000).toFixed(1)}</div></div>`).join(''):'<div class="empty">해당 카테고리는 원본 자료 추가 분석 후 반영됩니다.</div>'}function switchCat(c){cat=c;render();scrollTo(0,0)}
function openMenu(id){current=menus.find(m=>m.id===id);qty=1;selection={};(current.options||[]).forEach((g,i)=>selection[i]={});renderModal();document.getElementById('overlay').classList.add('open')};function closeMenu(){document.getElementById('overlay').classList.remove('open')};function changeQty(d){qty=Math.max(1,qty+d);renderModal()};function pick(gi,ii,d){const group=current.options[gi],s=selection[gi],old=s[ii]||0,total=Object.values(s).reduce((a,b)=>a+b,0);if(d>0&&total>=group.count)return; s[ii]=Math.max(0,old+d);renderModal()};function complete(){return (current.options||[]).every((g,i)=>Object.values(selection[i]).reduce((a,b)=>a+b,0)===g.count)}function extras(){return (current.options||[]).reduce((sum,g,i)=>sum+g.items.reduce((s,v,j)=>s+(selection[i][j]||0)*(v.price||0),0),0)}
function renderModal(){const modalEl=document.getElementById('modal');const priorScroll=modalEl.scrollTop;const m=current;const extra=extras();document.getElementById('modal').innerHTML=`<button class="back" onclick="closeMenu()">‹</button><img class="hero" src="${A+m.img}"><div class="stripe">${m.demo?'세트 메뉴 옵션 체험':'페어링 사이드 선택'}</div><div class="detail-pad">${m.tag?`<span class="tag ${m.tag==='New'?'orange':''}">${m.tag}</span>`:''}<h2>${m.name}</h2><div class="muted">${m.desc}</div><hr><div style="display:flex;justify-content:space-between;align-items:center;padding:15px 0"><strong class="detail-price">${m.demo?'데모용':money(m.price===null?null:m.price+extra)}</strong><div class="qty"><button onclick="changeQty(-1)">−</button>${qty}<button onclick="changeQty(1)">+</button></div></div></div>${(m.options||[]).length?`<div class="options"><b>옵션선택</b>${m.options.map((g,i)=>`<div class="optionhead"><span>• ${g.name}</span><span>${Object.values(selection[i]).reduce((a,b)=>a+b,0)} / ${g.count} <span class="required">필수</span></span></div><div class="optgrid">${g.items.map((v,j)=>`<div class="optcard"><img src="${A+v.img}"><div class="label">${v.name}${v.price?`<br><span style="color:#bc3325">[+${money(v.price)}]</span>`:''}</div><div class="optionqty"><button onclick="pick(${i},${j},-1)">−</button>${selection[i][j]||0}<button onclick="pick(${i},${j},1)">+</button></div></div>`).join('')}</div>`).join('')}</div>`:''}<button class="cta" onclick="addCart()">${complete()?'메뉴 담기':'필수 옵션을 선택해 주세요'}</button>`;modalEl.scrollTop=priorScroll};function addCart(){if(!complete()){alert('필수 옵션을 모두 선택해 주세요.');return}if(current.price===null){alert('판매가격 확인 전 메뉴입니다. 시제품에서 주문할 수 없습니다.');return}const options=(current.options||[]).flatMap((g,i)=>g.items.flatMap((v,j)=>(selection[i][j]||0)?[v.name+' × '+selection[i][j]]:[]));cart.push({name:current.name,qty,options,price:(current.price+extras())*qty,demo:current.demo});closeMenu();syncCart();showCart()};function syncCart(){let n=cart.reduce((a,b)=>a+b.qty,0);document.getElementById('badge').textContent=n;document.getElementById('floatingCount').textContent=n}function showCart(){const total=cart.reduce((a,b)=>a+b.price,0);document.getElementById('cartrows').innerHTML=cart.length?cart.map((m,i)=>`<div class="cartline"><button onclick="cart.splice(${i},1);syncCart();showCart()">삭제</button><strong>${m.name} × ${m.qty}</strong><p class="muted">${m.options.join(' / ')}</p><b>${m.demo?'데모 · 금액 미확정':money(m.price)}</b></div>`).join(''):'<div class="empty">장바구니가 비어 있습니다.</div>';document.getElementById('carttotal').textContent='합계 (데모 제외) '+money(total);document.getElementById('cartbox').classList.add('open')};function hideCart(){document.getElementById('cartbox').classList.remove('open')}render();
</script></body></html>
