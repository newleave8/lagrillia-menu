<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>라그릴리아 관리자 준비 화면</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f4f1;color:#20271e;font:15px/1.5 Arial,'Malgun Gothic',sans-serif}header{background:#20271e;color:#fff;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}header strong{font-family:Georgia,serif;letter-spacing:-1px;font-size:23px}header a{color:#fff;text-decoration:none;font-size:13px}main{max-width:850px;margin:24px auto;padding:0 16px 60px}.panel{background:#fff;border:1px solid #e4e2dd;border-radius:12px;padding:20px;margin-bottom:15px}h1{font-size:23px;margin:0 0 10px}h2{font-size:18px;margin:0 0 12px}.notice{background:#fff3df;color:#664a18;border-left:4px solid #d8972d;padding:14px;border-radius:6px;margin:14px 0}label{display:block;font-weight:700;margin:14px 0 5px}input,select,textarea{width:100%;border:1px solid #c9c9c2;border-radius:7px;padding:12px;font:inherit;background:#fff}textarea{resize:vertical;min-height:110px;white-space:pre-wrap}button{background:#293529;color:white;border:0;border-radius:8px;padding:12px 16px;font-weight:bold;cursor:pointer}button.alt{background:#eee;color:#252b24}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.preview{width:100%;max-height:235px;object-fit:contain;background:#f2f1ee;border:1px solid #eee;margin:8px 0}.sub{color:#666;font-size:13px}#editor{display:none}.tag{font-size:12px;background:#eee;padding:4px 8px;border-radius:5px}#status{font-size:13px;color:#696969;margin-top:10px}@media(max-width:600px){.grid{grid-template-columns:1fr}.panel{padding:16px}header strong{font-size:20px}}
</style></head><body><header><strong>LAGRILLIA</strong><a href="./">← 메뉴북으로</a></header><main><section class="panel"><h1>메뉴 관리</h1><div class="notice"><b>관리자 개발 중 · 시험 화면</b><div>현재는 이 기기에서 임시로 편집하고 미리보기만 가능합니다. 구글 시트·드라이브 저장과 고객 메뉴북 자동 반영은 아직 연결되지 않았습니다. 이 페이지에 비밀번호를 입력하지 마세요.</div></div><button onclick="start()">메뉴 편집 화면 열기</button></section>
<section class="panel" id="editor"><h2>메뉴 등록 / 수정 <span class="tag">로컬 임시저장</span></h2><label>기존 상품 또는 신규 상품</label><select id="choose"><option value="">새 메뉴</option></select><div class="grid"><div><label>카테고리</label><select id="cat"><option>그릴</option><option>프로모션</option><option>시즌 메뉴</option><option>해피아워</option><option>세트</option><option>파스타</option><option>라이스</option><option>피자</option><option>샐러드</option><option>사이드</option><option>디저트</option><option>음료</option><option>맥주</option><option>와인</option></select></div><div><label>판매가격(원)</label><input id="price" type="number" min="0" placeholder="119000"></div></div><label>메뉴명</label><input id="name" placeholder="예: 본인립아이 스테이크 [500g]"><label>영문 메뉴명</label><input id="en"><label>목록용 간단 설명</label><textarea id="summary" rows="2"></textarea><label>상세 설명 (엔터 줄바꿈 유지)</label><textarea id="detail" rows="6"></textarea><label>사진 파일</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp"><img id="photoPreview" class="preview" alt="메뉴 사진 미리보기" style="display:none"><label>사진 하단 문구</label><input id="caption" placeholder="예: 페어링 사이드 택2"><div class="actions"><button onclick="saveDraft()">이 기기에 임시 저장</button><button class="alt" onclick="exportDrafts()">입력 데이터 내보내기(JSON)</button><button class="alt" onclick="clearForm()">새 메뉴 작성</button></div><div id="status"></div><p class="sub">현재 편집 내용은 다른 직원에게 공유되거나 실제 고객 메뉴북에 적용되지 않습니다. 사진은 미리보기만 가능하며 서버에 전송되지 않습니다.</p></section></main><script>
const KEY='lag-menu-local-editor-v1';let selected='',fileData='';const $=id=>document.getElementById(id);let drafts=[];let catalog=[];try{drafts=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(_){}
async function start(){$('editor').style.display='block';$('status').textContent='기존 메뉴를 불러오는 중입니다.';try{const r=await fetch('menu-data.json?ts='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error('load');catalog=(await r.json()).menus||[];$('status').textContent='기존 메뉴를 선택해 편집할 수 있습니다. 저장은 이 기기에서만 가능합니다.'}catch(e){$('status').textContent='기존 메뉴를 가져오지 못했습니다. 로컬 초안은 편집할 수 있습니다.'}refresh();$('editor').scrollIntoView({behavior:'smooth'})}
function refresh(){const pick=$('choose');const merged=[...catalog,...drafts.filter(x=>!catalog.some(c=>c.id===x.id))];pick.innerHTML='<option value="">새 메뉴</option>'+merged.map(m=>'<option value="'+escapeHtml(m.id)+'">'+escapeHtml(m.name||'이름 없음')+'</option>').join('');pick.onchange=()=>{const m=drafts.find(x=>x.id===pick.value)||catalog.find(x=>x.id===pick.value);if(!m){clearForm();return}selected=m.id;$('cat').value=m.cat||m.category||'그릴';$('price').value=m.price??'';$('name').value=m.name||'';$('en').value=m.en||'';$('summary').value=m.summary||m.listDesc||'';$('detail').value=m.detail||'';$('caption').value=m.caption||'';fileData=m.image||'';showPhoto();$('status').textContent='기존 메뉴를 불러왔습니다. 변경사항은 이 기기에 임시 저장할 수 있습니다.'}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('photo').addEventListener('change',ev=>{const f=ev.target.files?.[0];if(!f)return;if(f.size>3*1024*1024){alert('미리보기는 3MB 이하 사진만 지원합니다.');return}const reader=new FileReader;reader.onload=()=>{fileData=String(reader.result);showPhoto()};reader.readAsDataURL(f)});
function showPhoto(){$('photoPreview').style.display=fileData?'block':'none';$('photoPreview').src=fileData}
function clearForm(){selected='';for(const k of ['price','name','en','summary','detail','caption'])$(k).value='';$('cat').value='그릴';fileData='';$('photo').value='';showPhoto();$('choose').value=''}
function saveDraft(){if(!$('name').value.trim()){alert('메뉴명을 입력해 주세요.');return}const m={id:selected||'draft-'+Date.now(),image:fileData};for(const k of ['cat','price','name','en','summary','detail','caption'])m[k]=$(k).value;const i=drafts.findIndex(x=>x.id===m.id);if(i>=0)drafts[i]=m;else drafts.push(m);try{localStorage.setItem(KEY,JSON.stringify(drafts));selected=m.id;refresh();$('choose').value=m.id;$('status').textContent='이 기기에 임시 저장되었습니다. 실제 웹앱에는 적용되지 않았습니다.'}catch(e){alert('기기 저장 공간 부족. 사진 크기를 줄여 주세요.')}}
function exportDrafts(){const content=JSON.stringify(drafts.map(({image,...m})=>({...m,imageOmitted:!!image})),null,2);const url=URL.createObjectURL(new Blob([content],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='lag-menu-drafts.json';a.click();URL.revokeObjectURL(url)}
</script></body></html>
