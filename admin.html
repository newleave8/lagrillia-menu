<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>라그릴리아 관리자</title><style>body{max-width:600px;margin:60px auto;padding:20px;font:16px/1.6 sans-serif}a{color:#29352a}</style><h1>라그릴리아 메뉴 관리</h1><p id="status">회사 관리자 서버로 이동 중…</p><p><a id="open" hidden>관리자 화면 열기</a></p><p><a href="./">고객 메뉴북으로</a></p><script>fetch('backend-config.json?t='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.json()}).then(c=>{if(!/^https:\/\/script\.google\.com\/macros\/s\/[a-zA-Z0-9_-]+\/exec$/.test(c.url))throw Error();const url=c.url+'?page=admin';const a=document.getElementById('open');a.href=url;a.hidden=false;location.replace(url)}).catch(()=>document.getElementById('status').textContent='관리자 서버 연결에 실패했습니다. 잠시 후 새로고침해 주세요.');</script></html>
