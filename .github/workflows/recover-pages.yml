name: Recover orphaned Pages queue
on:
  push:
    paths: ['.github/workflows/recover-pages.yml']
  workflow_dispatch:
permissions:
  actions: write
  pages: write
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Force cancel two orphaned retries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for run in 41289748229 41289140033; do
            gh api --method POST repos/newleave8/lagrillia-menu/actions/runs/$run/force-cancel || true
          done
      - name: Cancel orphaned Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST repos/newleave8/lagrillia-menu/pages/deployments/711fbf262d6f45fe0d03b7a34feea95eddba9b51/cancel
          gh api repos/newleave8/lagrillia-menu/pages/deployments/711fbf262d6f45fe0d03b7a34feea95eddba9b51
