name: Publish customer menu
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: customer-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public files only
        run: |
          mkdir _site
          cp index.html admin.html backend-config.json menu-data.json tablet-alerts.html preorder-push-worker.js _site/
          cp -R assets _site/assets
          mkdir -p _site/spc-square
          cp spc-square/index.html spc-square/admin.html spc-square/backend-config.json spc-square/tablet-alerts.html spc-square/preorder-push-worker.js _site/spc-square/
          mkdir -p _site/yangjae
          cp yangjae/index.html yangjae/admin.html yangjae/backend-config.json yangjae/tablet-alerts.html yangjae/preorder-push-worker.js _site/yangjae/
          mkdir -p _site/gongdeok
          cp gongdeok/index.html gongdeok/admin.html gongdeok/backend-config.json gongdeok/tablet-alerts.html gongdeok/preorder-push-worker.js _site/gongdeok/
          mkdir -p _site/cheonho
          cp cheonho/index.html cheonho/admin.html cheonho/backend-config.json cheonho/tablet-alerts.html cheonho/preorder-push-worker.js _site/cheonho/
          mkdir -p _site/garden-five
          cp garden-five/index.html garden-five/admin.html garden-five/backend-config.json garden-five/tablet-alerts.html garden-five/preorder-push-worker.js _site/garden-five/
          mkdir -p _site/dogok
          cp dogok/index.html dogok/admin.html dogok/backend-config.json dogok/tablet-alerts.html dogok/preorder-push-worker.js _site/dogok/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy customer menu
        id: deployment
        uses: actions/deploy-pages@v4
